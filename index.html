<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>История — КТ 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000000; /* Черный фон */
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* --- HEADER --- */
  header {
    background: rgba(10, 10, 10, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
  .tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 20px; }
  .tab {
    padding: 6px 14px; border-radius: 16px; border: none; cursor: pointer;
    background: transparent; color: #aaa; font-size: 13px; font-weight: 600;
    transition: .2s;
  }
  .tab.active { background: #1a56db; color: #fff; box-shadow: 0 2px 10px rgba(26,86,219,0.4); }

  .screen { display: none; flex: 1; padding: 18px; max-width: 800px; margin: 0 auto; width: 100%; }
  .screen.active { display: block; }

  /* --- ЭКРАН УЧЁБЫ --- */
  .ruler-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .ruler-btn {
    padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: #111; color: #aaa; cursor: pointer; font-size: 13px;
    font-weight: 600; transition: .2s; text-align: left;
  }
  .ruler-btn:hover { background: #222; }
  .ruler-btn.active { background: #1a56db; color: #fff; border-color: #1a56db; }
  .ruler-btn.empty { opacity: .5; }
  .ruler-btn .count { font-size: 11px; opacity: .7; font-weight: 400; display: block; margin-top: 2px; }

  .study-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .study-header h2 { font-size: 18px; color: #fff; font-weight: 700; }
  .hide-btn {
    padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: #111; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .hide-btn.on { background: #e94560; border-color: #e94560; }

  .point {
    background: #111; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  /* Подпункт в учебе - цветной */
  .point .q { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: #4db8ff; }
  .point .a { font-size: 14px; line-height: 1.55; color: #ccc; white-space: pre-line; }
  .point .a.hidden { display: none; }
  .point .empty-note { font-style: italic; color: #666; font-size: 13px; }

  /* --- ЭКРАН КАРТОЧЕК --- */
  #cardScreen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 18px; }
  #cardScreen.active { display: flex; }

  .progress-bar {
    width: 100%; max-width: 400px; height: 6px; background: rgba(255,255,255,0.15);
    border-radius: 4px; overflow: hidden; margin-bottom: 8px;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#1a56db,#e94560); width: 0%; transition: width .3s; }
  .counter { font-size: 12px; color: #aaa; margin-bottom: 22px; letter-spacing: 0.5px; }

  .card-wrap { width: 100%; max-width: 400px; perspective: 1200px; display: flex; justify-content: center; }
  .card {
    position: relative; background: rgba(26, 86, 219, 0.85); /* Синяя карточка */
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; padding: 24px 20px; min-height: 420px; width: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.15);
    touch-action: pan-y; user-select: none; cursor: grab;
    transition: transform .25s ease, opacity .25s ease;
  }
  .card.dragging { transition: none; cursor: grabbing; }
  
  /* Верхняя часть карточки (Вопрос) */
  .card-top { flex: 1; display: flex; flex-direction: column; }
  .card .ruler-tag {
    display: inline-block; background: rgba(255,255,255,0.2); color: #fff; font-size: 12px;
    font-weight: 700; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px;
    align-self: flex-start; backdrop-filter: blur(4px);
  }
  .card .question-text { font-size: 20px; font-weight: 700; line-height: 1.3; color: #fff; margin-bottom: 12px; }
  
  /* Список подпунктов на лицевой стороне */
  .card .q-points-list {
    font-size: 15px; line-height: 1.5; color: #e2e8f0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card .q-points-list div { display: flex; gap: 6px; align-items: baseline; }
  .card .q-points-list span.num { font-weight: 700; color: #fff; opacity: 0.7; }
  
  /* Ответ на обороте */
  .card .answer-text {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 14px; line-height: 1.55; color: #e2e8f0;
    display: none; max-height: 320px; overflow-y: auto; padding-right: 4px;
  }
  .card .answer-text::-webkit-scrollbar { width: 4px; }
  .card .answer-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  .card .answer-text.show { display: block; }
  .card .answer-text .ans-q { font-weight: 700; color: #4db8ff; margin-top: 12px; margin-bottom: 4px; display: block; }
  .card .answer-text .ans-a { color: #d1d9e6; white-space: pre-line; display: block; margin-bottom: 4px; }

  /* Кнопка */
  .show-btn {
    margin-top: 20px; padding: 14px 24px; border-radius: 16px; border: none;
    background: #fff; color: #1a56db; font-size: 15px; font-weight: 700;
    cursor: pointer; align-self: flex-start; width: 100%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.1s;
  }
  .show-btn:active { transform: scale(0.97); }

  .hint-swipe { margin-top: 20px; font-size: 12px; color: #888; text-align: center; }
  .hint-swipe b { color: #e94560; }

  .done-screen { text-align: center; padding: 30px; background: #111; border-radius: 24px; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
  .done-screen h2 { font-size: 24px; color: #fff; margin-bottom: 12px; }
  .done-screen p { font-size: 16px; color: #aaa; margin-bottom: 6px; }
  .restart-btn {
    margin-top: 22px; padding: 12px 28px; border-radius: 12px; border: none;
    background: #1a56db; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    width: 100%;
  }
</style>

/* ============================================================
   ЛОГИКА
   ============================================================ */

let currentRulerIdx = 0;
let hideAnswers = false;

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('studyScreen').classList.toggle('active', name === 'study');
  document.getElementById('cardScreen').classList.toggle('active', name === 'cards');
  if (name === 'cards') startCards();
}

function renderRulerList() {
  const list = document.getElementById('rulerList');
  list.innerHTML = '';
  DATA.forEach((r, i) => {
    const filled = r.points.filter(p => p.a.trim() !== '').length;
    const btn = document.createElement('button');
    btn.className = 'ruler-btn' + (i === currentRulerIdx ? ' active' : '') + (filled === 0 ? ' empty' : '');
    btn.innerHTML = r.ruler + '<span class="count">' + filled + ' / ' + r.points.length + '</span>';
    btn.onclick = () => { currentRulerIdx = i; renderRulerList(); renderStudy(); };
    list.appendChild(btn);
  });
}

function renderStudy() {
  const r = DATA[currentRulerIdx];
  const content = document.getElementById('studyContent');
  let html = '<div class="study-header"><h2>' + r.ruler + '</h2>';
  html += '<button class="hide-btn' + (hideAnswers ? ' on' : '') + '" onclick="toggleHide()">' + (hideAnswers ? 'Показать ответы' : 'Скрыть ответы') + '</button></div>';
  r.points.forEach(p => {
    html += '<div class="point"><div class="q">' + p.q + '</div>';
    if (p.a.trim() === '') {
      html += '<div class="a"><span class="empty-note">(нет данных — допиши позже)</span></div>';
    } else {
      html += '<div class="a' + (hideAnswers ? ' hidden' : '') + '">' + escapeHtml(p.a) + '</div>';
    }
    html += '</div>';
  });
  content.innerHTML = html;
}

function toggleHide() {
  hideAnswers = !hideAnswers;
  renderStudy();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- ЭКРАН КАРТОЧЕК ----------
let deck = [];        
let totalCards = 0;   
let knownCount = 0;   
let currentCard = null;

function buildFullDeck() {
  const arr = [];
  DATA.forEach((r) => {
    // Не добавляем в карточки полностью пустых правителей
    const hasAnswers = r.points.some(p => p.a.trim() !== '');
    if (hasAnswers) {
      arr.push({ ruler: r.ruler, points: r.points });
    }
  });
  return arr;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startCards() {
  deck = shuffle(buildFullDeck());
  totalCards = deck.length;
  knownCount = 0;
  currentCard = null;
  renderCard();
}

function renderCard() {
  const wrap = document.getElementById('cardWrap');
  const counter = document.getElementById('counter');
  const fill = document.getElementById('progressFill');

  counter.textContent = (totalCards - deck.length) + ' / ' + totalCards + '   ·   знал: ' + knownCount;
  fill.style.width = (totalCards ? ((totalCards - deck.length) / totalCards * 100) : 0) + '%';

  if (deck.length === 0) {
    wrap.innerHTML = '<div class="done-screen"><h2>🎉 Готово!</h2><p>Ты прошёл все карточки.</p><p>Знал: <b>' + knownCount + '</b> из <b>' + totalCards + '</b></p><button class="restart-btn" onclick="startCards()">Перемешать заново</button></div>';
    return;
  }

  currentCard = deck[0];

  // Формируем список подпунктов для ЛИЦЕВОЙ стороны
  let questionPointsHtml = '';
  currentCard.points.forEach(p => {
    questionPointsHtml += `<div><span class="num">•</span> ${p.q}</div>`;
  });

  // Формируем ответы для ОБОРОТНОЙ стороны
  let answersHtml = '';
  currentCard.points.forEach(p => {
    answersHtml += `<div class="ans-q">${p.q}</div>`;
    if (p.a.trim() === '') {
      answersHtml += `<div class="ans-a"><span class="empty-note">(нет данных)</span></div>`;
    } else {
      answersHtml += `<div class="ans-a">${escapeHtml(p.a)}</div>`;
    }
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-top">
      <span class="ruler-tag">${currentCard.ruler}</span>
      <div class="q-points-list" id="qPointsList">
        ${questionPointsHtml}
      </div>
    </div>
    <div class="answer-text" id="answerText">
      ${answersHtml}
    </div>
    <button class="show-btn" id="showBtn">Показать ответ</button>
  `;
  wrap.innerHTML = '';
  wrap.appendChild(card);

  document.getElementById('showBtn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('qPointsList').style.display = 'none'; // прячем лицо
    document.getElementById('answerText').classList.add('show');
    document.getElementById('showBtn').style.display = 'none';
  };

  attachSwipe(card);
}

function attachSwipe(card) {
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, locked = null;

  const onStart = (x, y) => {
    startX = x; startY = y; dx = 0; dy = 0; dragging = true; locked = null;
    card.classList.add('dragging');
  };
  const onMove = (x, y) => {
    if (!dragging) return;
    dx = x - startX;
    dy = y - startY;
    if (locked === null) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
    }
    if (locked === 'x') {
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
      card.style.opacity = Math.max(0.4, 1 - Math.abs(dx) / 400);
    }
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (locked === 'x' && Math.abs(dx) > 80) {
      const know = dx > 0;
      card.style.transform = 'translateX(' + (know ? 600 : -600) + 'px) rotate(' + (know ? 30 : -30) + 'deg)';
      card.style.opacity = '0';
      setTimeout(() => {
        const done = deck.shift();
        if (know) {
          knownCount++;
        } else {
          deck.push(done); // вернуть в конец
        }
        renderCard();
      }, 250);
    } else {
      card.style.transform = '';
      card.style.opacity = '';
    }
  };

  card.addEventListener('mousedown', e => { if (e.target.closest('.show-btn')) return; onStart(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
  
  card.addEventListener('touchstart', e => {
    if (e.target.closest('.show-btn')) return;
    if (e.target.closest('.answer-text')) {
      if (document.getElementById('answerText').classList.contains('show')) return;
    }
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (locked === null) {
      const ddx = x - startX, ddy = y - startY;
      if (Math.abs(ddx) > 8 || Math.abs(ddy) > 8) {
        locked = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
      }
    }
    if (locked === 'x') {
      e.preventDefault();
    }
    onMove(x, y);
  }, { passive: false });

  card.addEventListener('touchend', onEnd);
}

// ---------- СТАРТ ----------
renderRulerList();
renderStudy();
</script>
